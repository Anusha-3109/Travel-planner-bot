<!-- The hero on an empty chat: the logo with the tagline under it, on the left and kept small so
     the box, examples and feature cards fit on a laptop screen. Filled in by render.hero(). -->
<div class="tm-hero" style="display: flex; flex-direction: column; align-items: flex-start; gap: 0.15rem;">
  <img src="$logo" alt="tripmate" style="width: 140px;">
  <p style="margin: 0;">$tagline</p>
</div>
