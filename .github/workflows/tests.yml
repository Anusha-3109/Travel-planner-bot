# Runs the test suite on every push to main and on pull requests.
# The tests use recorded API answers and the committed 2026 city files, so no API keys, credit,
# searches or downloads are needed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q
