# Runs the test suite on every push to main and on pull requests.
# The tests use recorded API answers, so no API keys, credit or searches are needed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      # The TravelPlanner dataset (about 70 MB) is not stored in git; download it once and reuse it.
      - name: Reuse the TravelPlanner download
        uses: actions/cache@v6
        with:
          path: data/travelplanner
          key: travelplanner-v1

      - name: Download TravelPlanner data if missing
        run: |
          if [ ! -f data/travelplanner/test_ref_info.jsonl ]; then
            python -m travel_data.download
          fi

      - name: Run the tests
        run: python -m pytest -q
